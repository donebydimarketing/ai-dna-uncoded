<!--
  REPLACEMENT for the existing <script type="module"> block at the bottom
  of the AI DNA: Uncoded page (the one containing SUPABASE_URL, MEMBER_LINK,
  and window.goPay). Replace that entire block with the one below.

  WHAT CHANGED AND WHY:

  1. If auth.signUp() fails specifically because the account already exists
     ("User already registered"), the form now attempts signInWithPassword
     with the same email and password instead of stopping. This recovers
     anyone who registered once, did not finish paying, and came back to
     try again, which is exactly what happened with Hermilia.

  2. If that sign-in also fails (meaning the password does not match what
     they used the first time), the form shows a clear, specific message
     instead of Supabase's raw internal error text, and tells them what to
     do next.

  3. The database write changed from .insert() to .upsert() with
     onConflict: 'email', so a second attempt updates the existing
     ai_dna_registrations row (new tier, new amount, status reset to
     pending_payment) instead of throwing a duplicate-row error.

  REQUIRED ONE-TIME SUPABASE CHANGE BEFORE THIS WILL WORK:

  The ai_dna_registrations table needs a UNIQUE constraint on the "email"
  column for the upsert to target the right row. In Supabase Studio:
  Table Editor -> ai_dna_registrations -> email column -> enable
  "Is Unique". If a unique constraint is not added, upsert will silently
  fall back to inserting a new row every time instead of updating the old
  one, and Hermilia (and anyone else who retries) will end up with
  multiple rows in that table.
-->

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://brvqrasnjnqihxrvtgks.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydnFyYXNuam5xaWh4cnZ0Z2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NzQyOTMsImV4cCI6MjEwMTU1MDI5M30.SHTstTnHTNVXLuFXbPH4JWL8O0oq-y-ggxdFwZtMYb8';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MEMBER_LINK = 'https://buy.stripe.com/28E4gyfTc0sAfNtgskgYU01';
const NONMEMBER_LINK = 'https://buy.stripe.com/8x27sKayS4IQ6cTb80gYU02';

const show = id => {
  ['step1','step2','step4'].forEach(s => document.getElementById(s).hidden = (s !== id));
  document.getElementById('register').scrollIntoView({behavior:'smooth'});
};

window.goPay = async function(evt){
  const name = document.getElementById('f-name').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const pass = document.getElementById('f-pass').value;
  const fb = document.getElementById('f-fb').value.trim();
  const tier = document.getElementById('f-tier').value;
  const err = document.getElementById('err1');
  const btn = evt.target;

  if(!name || !email.includes('@') || pass.length < 8 || !fb){
    err.textContent = 'Complete every field. Password needs at least 8 characters.';
    return;
  }
  err.textContent = '';
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'PLEASE WAIT...';

  try{
    let userId = null;

    // First attempt: create a new account.
    const { data: authData, error: authError } = await supabase.auth.signUp({
      email,
      password: pass,
      options: { data: { full_name: name } }
    });

    if(authError){
      const alreadyRegistered = /already registered/i.test(authError.message || '');
      if(!alreadyRegistered){
        throw authError; // some other real error, stop here as before
      }

      // This email already has an account. Assume this is a returning
      // registrant finishing an earlier, unpaid attempt, and try to
      // sign them in with the password they just typed.
      const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({
        email,
        password: pass
      });

      if(signInError){
        err.textContent = 'This email is already registered with a different password. Use the password you set the first time, or message us to reset it.';
        show('step1');
        return;
      }

      userId = signInData.user ? signInData.user.id : null;
    } else {
      userId = authData.user ? authData.user.id : null;
    }

    const amount = tier === 'member' ? 1999 : 3999;

    // Upsert instead of insert: updates the existing row for a returning
    // registrant instead of failing on a duplicate, and resets status so
    // a fresh Stripe attempt is expected.
    const { error: upsertError } = await supabase
      .from('ai_dna_registrations')
      .upsert({
        user_id: userId,
        full_name: name,
        email: email,
        facebook_url: fb,
        tier: tier,
        amount_php: amount,
        status: 'pending_payment'
      }, { onConflict: 'email' });

    if(upsertError) throw upsertError;

    document.getElementById('pay-amount').textContent = tier === 'member' ? 'PHP 1,999' : 'PHP 3,999';
    show('step2');

    const baseLink = tier === 'member' ? MEMBER_LINK : NONMEMBER_LINK;
    const payUrl = `${baseLink}?client_reference_id=${encodeURIComponent(userId)}&prefilled_email=${encodeURIComponent(email)}`;

    window.location.href = payUrl;
  }catch(e){
    show('step1');
    err.textContent = e.message || 'Something went wrong. Please try again.';
  }finally{
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
};
</script>
